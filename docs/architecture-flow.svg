<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="2240" viewBox="0 0 1440 2240" role="img" aria-labelledby="title desc">
<title id="title">Startrail: YouTube link to Malody 4K chart workflow</title>
<desc id="desc">Bilingual flow diagram showing public YouTube metadata lookup, audio-only download, local audio preparation, MuG or Mapperatorinator generation, onset-assisted difficulty calibration, MCZ packaging and validation.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4fafc"/><stop offset=".55" stop-color="#eef7f8"/><stop offset="1" stop-color="#f6f4fa"/></linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19384d"/><stop offset="1" stop-color="#132b40"/></linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#dff6ee"/><stop offset="1" stop-color="#e5f7f8"/></linearGradient>
  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff0f5"/><stop offset="1" stop-color="#f4effa"/></linearGradient>
  <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-color="#21455a" flood-opacity=".09"/></filter>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#5c8795"/></marker>
  <marker id="arrowMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#39aa94"/></marker>
</defs>
<rect width="1440" height="2100" rx="30" fill="url(#paper)"/>
<circle cx="1320" cy="115" r="180" fill="#8edcd1" opacity=".12"/><circle cx="95" cy="1670" r="220" fill="#d394bd" opacity=".08"/>
<!-- subtle four-lane rhythm rail -->
<g opacity=".38" stroke="#d8e8eb" stroke-width="2"><path d="M610 165v1770M683 165v1770M756 165v1770M829 165v1770"/></g>
<g opacity=".78"><rect x="631" y="170" width="30" height="9" rx="4.5" fill="#62c9d0"/><rect x="704" y="170" width="30" height="9" rx="4.5" fill="#83aee9"/><rect x="777" y="170" width="30" height="9" rx="4.5" fill="#e48ab3"/><rect x="850" y="170" width="30" height="9" rx="4.5" fill="#dc6e9c"/></g>

<!-- Header -->
<g font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <text x="110" y="72" fill="#4a9b9c" font-size="16" font-weight="700" letter-spacing="2">STARTRAIL　/　MALODY 4K</text>
  <text x="110" y="126" fill="#18374c" font-size="38" font-weight="760">一条 YouTube 链接，如何变成 4K 曲包</text>
  <text x="112" y="158" fill="#5d7888" font-size="17">From a public track link to a validated Malody package — audio stays on your machine.</text>
  <g transform="translate(1135 63)"><rect width="190" height="51" rx="25" fill="#16344a"/><circle cx="26" cy="25.5" r="5" fill="#78e0c0"/><text x="44" y="31" fill="#e9f8f6" font-size="14" font-weight="700">LOCAL INFERENCE</text></g>
</g>

<!-- 01 Link -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="195" width="1220" height="118" rx="20" fill="#fff" stroke="#d4e5e9"/>
  <circle cx="157" cy="254" r="25" fill="#dff5f1"/><text x="157" y="260" text-anchor="middle" fill="#258a82" font-size="15" font-weight="800">01</text>
  <text x="202" y="242" fill="#17364b" font-size="23" font-weight="740">粘贴 YouTube 单曲链接</text>
  <text x="202" y="273" fill="#688293" font-size="16">Paste a supported HTTPS link, or search by song title</text>
  <g transform="translate(890 225)"><rect width="392" height="58" rx="13" fill="#f4f9fb" stroke="#d9e8ec"/><circle cx="25" cy="29" r="8" fill="none" stroke="#64aab1" stroke-width="2.5"/><path d="m31 35 8 8" stroke="#64aab1" stroke-width="2.5" stroke-linecap="round"/><text x="54" y="35" fill="#75909e" font-size="15">youtube.com/watch?v=…</text></g>
</g>
<path d="M720 314v37" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 02 Metadata -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="360" width="1220" height="146" rx="20" fill="#fff" stroke="#d4e5e9"/>
  <circle cx="157" cy="433" r="25" fill="#e2edf9"/><text x="157" y="439" text-anchor="middle" fill="#557fc0" font-size="15" font-weight="800">02</text>
  <text x="202" y="418" fill="#17364b" font-size="22" font-weight="740">读取公开曲目信息</text>
  <text x="202" y="448" fill="#688293" font-size="15">yt-dlp resolves title, artist, duration and thumbnail metadata.</text>
  <text x="202" y="475" fill="#98718a" font-size="14" font-weight="650">只获取资料，不下载视频画面　/　Metadata only — no video frames</text>
  <g transform="translate(835 390)" font-size="14" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif">
    <rect width="118" height="38" rx="19" fill="#edf6f8"/><text x="59" y="25" text-anchor="middle" fill="#42697a">曲名 / Title</text>
    <rect x="130" width="126" height="38" rx="19" fill="#edf6f8"/><text x="193" y="25" text-anchor="middle" fill="#42697a">音乐人 / Artist</text>
    <rect x="268" width="128" height="38" rx="19" fill="#edf6f8"/><text x="332" y="25" text-anchor="middle" fill="#42697a">时长 / Length</text>
    <rect y="50" width="150" height="34" rx="17" fill="#fff0f5"/><text x="75" y="72" text-anchor="middle" fill="#a56483">公开缩略图 / Art</text>
    <text x="171" y="72" fill="#879ca7">单曲；播放列表不会展开 / Single track only</text>
  </g>
</g>
<path d="M720 507v34" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 03 Download -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="550" width="1220" height="135" rx="20" fill="#fff" stroke="#d4e5e9"/>
  <circle cx="157" cy="617" r="25" fill="#e6f5e9"/><text x="157" y="623" text-anchor="middle" fill="#47956b" font-size="15" font-weight="800">03</text>
  <text x="202" y="605" fill="#17364b" font-size="22" font-weight="740">确认版本，只下载音轨</text>
  <text x="202" y="636" fill="#688293" font-size="15">Choose the right upload, then cache its audio locally for preview and reuse.</text>
  <g transform="translate(890 580)"><rect width="390" height="70" rx="15" fill="url(#mint)" stroke="#b9e6dc"/><path d="M31 20v24m-9-9 9 9 9-9M19 49h24" fill="none" stroke="#3a9d87" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="61" y="31" fill="#286f69" font-size="15" font-weight="700">公开音源 / Public audio</text><text x="61" y="52" fill="#628c8d" font-size="13">5 秒–10 分钟　·　≤ 200 MB</text></g>
</g>
<path d="M720 686v34" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 04 Normalize -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="730" width="1220" height="183" rx="22" fill="#fff" stroke="#d4e5e9"/>
  <circle cx="157" cy="820" r="25" fill="#fff1e4"/><text x="157" y="826" text-anchor="middle" fill="#bb8251" font-size="15" font-weight="800">04</text>
  <text x="202" y="782" fill="#17364b" font-size="22" font-weight="740">本地音频准备与校验</text>
  <text x="202" y="810" fill="#688293" font-size="15">FFmpeg converts the source; the audio timeline is checked and preserved.</text>
  <g transform="translate(202 837)"><rect width="420" height="52" rx="12" fill="#eef6fb" stroke="#d8e7f0"/><circle cx="24" cy="26" r="5" fill="#739cce"/><text x="42" y="23" fill="#345c79" font-size="14" font-family="Consolas, monospace">analysis.wav</text><text x="42" y="42" fill="#788f9c" font-size="12">单声道 22.05 kHz　/　Mono analysis</text></g>
  <g transform="translate(646 837)"><rect width="420" height="52" rx="12" fill="#eaf8f3" stroke="#c8e9de"/><circle cx="24" cy="26" r="5" fill="#55b99c"/><text x="42" y="23" fill="#2e756d" font-size="14" font-family="Consolas, monospace">audio.ogg</text><text x="42" y="42" fill="#788f9c" font-size="12">立体声 44.1 kHz　/　Packaged audio</text></g>
  <g transform="translate(1090 841)"><text x="0" y="17" fill="#708b99" font-size="13">5 秒–10 分钟</text><text x="0" y="40" fill="#708b99" font-size="13">静音 / 时间轴检查</text></g>
</g>
<path d="M720 914v34" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 05 Configuration -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="958" width="1220" height="140" rx="22" fill="url(#ink)"/>
  <circle cx="157" cy="1028" r="25" fill="#274d63"/><text x="157" y="1034" text-anchor="middle" fill="#9be9d1" font-size="15" font-weight="800">05</text>
  <text x="202" y="1015" fill="#effaf8" font-size="22" font-weight="740">选择模型条件与要生成的档位</text>
  <text x="202" y="1047" fill="#bdd3d9" font-size="15">Model conditions shape one source chart; selected tiers control the final chart set.</text>
  <g transform="translate(810 986)" font-size="13" font-weight="650">
    <text x="0" y="17" fill="#a9c4cc">输出难度 / OUTPUT TIERS</text>
    <rect y="31" width="71" height="32" rx="16" fill="#c9eee4"/><text x="35" y="52" text-anchor="middle" fill="#347b6c">Easy</text>
    <rect x="79" y="31" width="89" height="32" rx="16" fill="#dceafd"/><text x="123" y="52" text-anchor="middle" fill="#4f79b1">Medium</text>
    <rect x="176" y="31" width="67" height="32" rx="16" fill="#fae7cb"/><text x="209" y="52" text-anchor="middle" fill="#a47741">Hard</text>
    <rect x="251" y="31" width="77" height="32" rx="16" fill="#ede2f8"/><text x="289" y="52" text-anchor="middle" fill="#79629e">Expert</text>
    <rect x="336" y="31" width="78" height="32" rx="16" fill="#f8dce9"/><text x="375" y="52" text-anchor="middle" fill="#a65f80">Master</text>
    <rect x="422" y="31" width="87" height="32" rx="16" fill="#f6dce4"/><text x="465" y="52" text-anchor="middle" fill="#a95177">Lunatic</text>
  </g>
</g>
<path d="M720 1100v32" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 06 Engine branches -->
<g font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <text x="110" y="1157" fill="#4c8990" font-size="14" font-weight="750" letter-spacing="1">06　LOCAL MODEL INFERENCE / 本地模型推理</text>
  <g filter="url(#shadow)"><rect x="110" y="1175" width="560" height="153" rx="22" fill="#fff" stroke="#cce8e1" stroke-width="2"/><rect x="110" y="1175" width="9" height="153" rx="4" fill="#57b99b"/><circle cx="155" cy="1220" r="15" fill="#dcf4eb"/><path d="M148 1220h14m-7-7v14" stroke="#39977d" stroke-width="2"/><text x="185" y="1218" fill="#17364b" font-size="22" font-weight="740">MuG Diffusion</text><text x="145" y="1260" fill="#617e8d" font-size="15">音频条件扩散　/　Audio-conditioned diffusion</text><text x="145" y="1291" fill="#80949e" font-size="13">MuG 难度与风格参数作用于共享母谱</text></g>
  <g filter="url(#shadow)"><rect x="770" y="1175" width="560" height="153" rx="22" fill="#fff" stroke="#d8d2ed" stroke-width="2"/><rect x="1321" y="1175" width="9" height="153" rx="4" fill="#9a83c3"/><circle cx="815" cy="1220" r="15" fill="#eee8f8"/><path d="M808 1220h14m-7-7v14" stroke="#826aae" stroke-width="2"/><text x="845" y="1218" fill="#17364b" font-size="22" font-weight="740">Mapperatorinator V32</text><text x="805" y="1260" fill="#617e8d" font-size="15">Mania + timing 模型　/　Mania and timing models</text><text x="805" y="1291" fill="#80949e" font-size="13">模型输出转为 4K MC；保留分段 BPM</text></g>
</g>
<!-- Branch join -->
<path d="M390 1329v28h330v24M1050 1329v28H720v24" fill="none" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="420" y="1384" width="600" height="116" rx="24" fill="url(#mint)" stroke="#a8ddcf" stroke-width="2"/>
  <g transform="translate(468 1411)"><rect x="0" y="0" width="22" height="7" rx="3.5" fill="#55bcc1"/><rect x="0" y="16" width="22" height="7" rx="3.5" fill="#819fe2"/><rect x="0" y="32" width="22" height="7" rx="3.5" fill="#d88aae"/><rect x="0" y="48" width="22" height="7" rx="3.5" fill="#c65e8c"/></g>
  <text x="515" y="1431" fill="#194c50" font-size="23" font-weight="760">一份共享母谱</text>
  <text x="515" y="1462" fill="#527b7c" font-size="15">One model chart supplies timing and lane anchors to all selected tiers.</text>
</g>
<path d="M720 1502v35" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 07 audio candidates -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="1544" width="1220" height="127" rx="21" fill="#fff" stroke="#d4e5e9"/>
  <circle cx="157" cy="1607" r="25" fill="#fff0f5"/><text x="157" y="1613" text-anchor="middle" fill="#a85e82" font-size="15" font-weight="800">07</text>
  <text x="202" y="1594" fill="#17364b" font-size="22" font-weight="740">音乐起音作为第二路参考</text>
  <text x="202" y="1626" fill="#688293" font-size="15">Spectral-flux peaks across low, mid and high bands are merged with model anchors.</text>
  <g transform="translate(915 1574)"><path d="M0 36h26l8-20 10 45 11-34 10 18 9-9 8 0 10-25 11 47 11-31 10 9 11 0 9-15 10 28 10-13h24" fill="none" stroke="#d578a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="5" y="83" fill="#9b7489" font-size="13">Audio attacks, not invented beats</text></g>
</g>
<path d="M720 1672v35" stroke="#39aa94" stroke-width="3" marker-end="url(#arrowMint)"/>

<!-- 08 Calibration -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="1712" width="1220" height="150" rx="24" fill="#fff" stroke="#b7e2d8" stroke-width="2"/>
  <rect x="110" y="1712" width="1220" height="8" rx="4" fill="#5bc1a6"/>
  <circle cx="157" cy="1770" r="25" fill="#ddf5eb"/><text x="157" y="1776" text-anchor="middle" fill="#368d73" font-size="15" font-weight="800">08</text>
  <text x="202" y="1760" fill="#17364b" font-size="22" font-weight="740">按档位校准音符密度与手机可玩性</text>
  <text x="202" y="1790" fill="#688293" font-size="14">每档组合不同的目标 NPS、同刻上限、最短同轨间隔、峰值上限与长条规则。</text>
  <text x="202" y="1818" fill="#688293" font-size="14">Each tier selects from detected musical activity; quiet sections are not filled just to hit a target.</text>
  <g transform="translate(1040 1746)"><path d="M0 0v74" stroke="#d7e8e5" stroke-width="2"/><text x="22" y="23" fill="#4d857f" font-size="13" font-weight="700">PLAYABILITY</text><text x="22" y="48" fill="#76918f" font-size="13">4 lanes · no overlaps</text><text x="22" y="68" fill="#76918f" font-size="13">real audio time retained</text></g>
</g>
<path d="M720 1863v31" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 09 packaging -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="110" y="1899" width="1220" height="126" rx="22" fill="#fff" stroke="#d4e5e9"/>
  <circle cx="157" cy="1962" r="25" fill="#e7edf9"/><text x="157" y="1968" text-anchor="middle" fill="#657fb0" font-size="15" font-weight="800">09</text>
  <text x="202" y="1948" fill="#17364b" font-size="22" font-weight="740">打包曲谱、音频与来源信息</text>
  <text x="202" y="1978" fill="#688293" font-size="14">One folder per song: selected .mc charts + audio.ogg + generation.txt</text>
  <g transform="translate(894 1925)" font-family="Consolas, monospace" font-size="13">
    <rect width="126" height="34" rx="10" fill="#e8f4fc"/><text x="63" y="22" text-anchor="middle" fill="#4c78a1">Easy.mc …</text>
    <rect x="136" width="107" height="34" rx="10" fill="#e8f8f2"/><text x="189" y="22" text-anchor="middle" fill="#3e8978">audio.ogg</text>
    <rect x="253" width="132" height="34" rx="10" fill="#fff0f5"/><text x="319" y="22" text-anchor="middle" fill="#a55f7f">background.jpg</text>
    <text x="6" y="67" fill="#80949e" font-family="Inter, Segoe UI, Microsoft YaHei, Arial, sans-serif">可选原视频缩略图 / optional YouTube thumbnail</text>
  </g>
</g>
<path d="M720 2026v29" stroke="#5c8795" stroke-width="3" marker-end="url(#arrow)"/>

<!-- 10 output -->
<g filter="url(#shadow)" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
  <rect x="250" y="2060" width="940" height="92" rx="24" fill="url(#ink)"/>
  <circle cx="302" cy="2106" r="24" fill="#24546a"/><path d="M291 2106h20m-7-7 7 7-7 7" fill="none" stroke="#9be9d1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="345" y="2099" fill="#f0faf8" font-size="22" font-weight="760">结构校验通过后，下载 .mcz</text>
  <text x="345" y="2126" fill="#b7cfd5" font-size="14">ZIP · MC JSON · 4K lanes · timing · audio references　/　仍建议手机实机导入与试玩</text>
  <g transform="translate(1052 2081)"><rect width="104" height="50" rx="15" fill="#79dfc0"/><text x="52" y="32" text-anchor="middle" fill="#143c3b" font-size="18" font-weight="800">.MCZ</text></g>
</g>
<text x="720" y="2180" text-anchor="middle" fill="#8197a0" font-family="Inter, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="13">LOCAL AUDIO PROCESSING　·　AI SOURCE DISCLOSED　·　HUMAN PLAY-TEST RECOMMENDED</text>
</svg>